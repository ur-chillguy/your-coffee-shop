<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html,body{margin:0}body{font-size:14px}</style>
</head>
<body>
<title>Your Coffee Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: satu halaman, dua pintu. Pembeli (HP, tanpa login) dan Staf (login PIN: admin atau kasir). Merah poster menu kedai sebagai aksen. */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --ink:#1A211E; --muted:#5C675F; --line:#D9DDD6; --soft:#E7EAE4;
  --accent:#C8102E; --accent-ink:#FFFFFF;
  --ok:#1C7A4D; --okbg:#DFF1E7; --warn:#9A5800; --warnbg:#F8EAD0; --info:#1D5BBF; --infobg:#DFE9FA; --bad:#B3261E;
  --c-on:#2F6FDB; --c-ka:#C8102E; --bar:#6B7A70;
  --f-display:'Archivo',system-ui,sans-serif; --f-body:'Instrument Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B211E; --ink:#EEF1EC; --muted:#9AA59E; --line:#2D3631; --soft:#242C28;
  --accent:#FF5A6E; --accent-ink:#1E0A0E;
  --ok:#5CC995; --okbg:#1B3328; --warn:#F0B04A; --warnbg:#3A2C12; --info:#8DB1F7; --infobg:#1C2B47; --bad:#FF8A80;
  --c-on:#8DB1F7; --c-ka:#FF5A6E; --bar:#8A998F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B211E; --ink:#EEF1EC; --muted:#9AA59E; --line:#2D3631; --soft:#242C28;
  --accent:#FF5A6E; --accent-ink:#1E0A0E;
  --ok:#5CC995; --okbg:#1B3328; --warn:#F0B04A; --warnbg:#3A2C12; --info:#8DB1F7; --infobg:#1C2B47; --bad:#FF8A80;
  --c-on:#8DB1F7; --c-ka:#FF5A6E; --bar:#8A998F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-variation-settings:"wdth" 118;margin:0;text-wrap:balance;letter-spacing:.01em}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:850;font-size:17px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding-bottom:110px}
.wrap.wide{max-width:1120px;padding-bottom:60px}

.hello{padding:8px 0 14px}
.hello h1{font-size:25px;line-height:1.1;font-weight:850}
.sub{color:var(--muted);margin:8px 0 0}
.sub b{color:var(--ink)}
.srow{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.srow>input{flex:1;min-width:140px}
.srow input,.srow select,.fld{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;display:flex;gap:8px;overflow-x:auto;padding:10px 0;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{opacity:.6;font-weight:500;margin-left:4px}
.ch{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:16px 0 4px}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.it[data-a]{cursor:pointer}
.it .tx{flex:1;min-width:0}
.it .nm{font-weight:600}
.it .pr{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.it .hint{color:var(--muted);font-size:12px}
.it.out{opacity:.5}
.it .inc{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.plus{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.low{background:var(--warnbg);color:var(--warn)}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.cartbar button{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:15px 18px;font-weight:700;font-size:16px}

.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px 18px;font-weight:700;width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.ok{background:var(--ok);color:#fff}
.btn.warn{background:var(--warnbg);color:var(--warn)}
.btn:disabled{opacity:.5}

.ov{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sh h2{font-size:21px;font-weight:850}
.grp{margin-top:16px}
.gl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt small{font-weight:500}
.stp{display:flex;align-items:center;gap:12px}
.stp button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:18px}
.stp b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.line{padding:12px 0;border-bottom:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eta{background:var(--infobg);color:var(--info);border-radius:12px;padding:10px 14px;font-weight:600;margin:14px 0}

.pay{max-width:420px;margin:0 auto;padding:8px 0 40px;text-align:center}
.qrbox{background:#fff;border-radius:16px;padding:16px;display:inline-block;margin:16px 0 8px;border:1px solid var(--line)}
.qrbox svg{display:block;width:230px;max-width:100%;height:auto}
.qrbox.s svg{width:150px}
.amt{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-weight:850;font-size:30px}
.cd{font-family:var(--f-mono);font-weight:700}
.status{max-width:460px;margin:0 auto;padding:8px 0 40px}
.big{font-family:var(--f-mono);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em}
.steps{display:flex;gap:6px;margin:18px 0}
.steps div{flex:1;text-align:center;font-size:12px;font-weight:700;padding:10px 4px;border-radius:10px;background:var(--soft);color:var(--muted)}
.steps div.done{background:var(--okbg);color:var(--ok)}
.steps div.now{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}

/* staf */
.login{max-width:400px;margin:8px auto 0;display:grid;gap:12px}
.login h1{font-size:25px;font-weight:850}
.login .fld{width:100%}
.demo{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.demo b{color:var(--ink);font-family:var(--f-mono)}
.staffbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:2px 0 10px}
.me{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:auto}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px}
.staffbar select{padding:7px 10px}
.ktabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ktabs::-webkit-scrollbar{display:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 22px;padding:6px 0 14px;color:var(--muted)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.oc .no{font-family:var(--f-mono);font-weight:700;font-size:22px}
.oc ul{list-style:none;padding:0;margin:10px 0 12px;display:grid;gap:6px}
.oc li{display:flex;gap:8px}
.oc li b{font-variant-numeric:tabular-nums;min-width:26px}
.oc li small{display:block}
.oc .btn+.btn{margin-top:8px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.pill.dine{background:var(--infobg);color:var(--info)}
.pill.take{background:var(--warnbg);color:var(--warn)}
.pill.online{background:var(--soft);color:var(--c-on)}
.pill.kasir{background:var(--soft);color:var(--c-ka)}
.pill.admin{background:var(--ink);color:var(--bg)}
.pill.kr{background:var(--soft);color:var(--muted)}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}

.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) 130px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .fld,.stk{width:100%;padding:7px 10px;font-variant-numeric:tabular-nums}
.addm{display:grid;grid-template-columns:2fr 1.4fr 1fr auto;gap:8px;margin:0 0 12px;align-items:center}
@media (max-width:720px){.addm{grid-template-columns:1fr 1fr}.addm .btn,.addm label{grid-column:1 / -1}}
.mat{overflow-x:auto}
.mat .in{min-width:calc(200px + var(--nk) * 100px)}
.mt{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--nk),90px);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mt.h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:2px}
.mt .nm{font-weight:600}
.stk.zero{border-color:var(--warn);color:var(--warn)}
.bulk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.bulk .fld{padding:8px 10px;width:110px}
.set{max-width:620px}
.set .r{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set input[type=range]{width:140px;accent-color:var(--accent)}
.sw{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;white-space:nowrap}
.sw.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.sw.off{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.note{color:var(--muted);font-size:13px}
.urow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) 90px auto;gap:10px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:720px){.urow{grid-template-columns:1fr 1fr}}
.urow .fld{padding:7px 10px;width:100%;font-family:var(--f-mono)}
.cb{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:14px}
.perm{display:grid;grid-template-columns:1fr 70px 70px;gap:4px 10px;font-size:14px;margin:6px 0 16px;max-width:460px}
.perm b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.perm span:nth-child(3n+2),.perm span:nth-child(3n){text-align:center}

/* keuangan */
.fbar{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;align-items:center}
.fbar .grpc{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:800;font-size:22px;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:480px){.kpi .v{font-size:18px}.kpi{padding:12px}}
.dl{font-size:12px;color:var(--muted)}
.dl.good{color:var(--ok)}
.dl.bad{color:var(--bad)}
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;min-width:0}
.fsec h3{font-size:15px;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr}}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin:6px 0 8px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto}
.chart .tx{fill:var(--muted);font:11px var(--f-body)}
.chart .gl2{stroke:var(--line);stroke-width:1}
.chart .s-on{fill:var(--c-on)}
.chart .s-ka{fill:var(--c-ka)}
details.tb{margin-top:8px}
details.tb summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{background:var(--soft);border-radius:4px;height:10px}
.hb .tr i{display:block;height:100%;border-radius:4px;background:var(--bar)}
.hb b{font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:34px repeat(15,minmax(0,1fr));gap:3px;margin-top:8px}
.heat .c{aspect-ratio:1;border-radius:4px;min-height:14px}
.heat .hl,.heat .dl2{font-size:10px;color:var(--muted);align-self:center}
.heat .hl{text-align:center}
.pos{color:var(--ok)}
.neg{color:var(--bad)}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;margin-top:10px}
.mf label{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mf .fld{width:100%;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}

.dr{display:block;border-radius:12px;flex:none;object-fit:cover}
.dr .o{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dr .o3{stroke-width:3}
.dr .sf{fill:var(--soft);stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round}
.dr .cu{fill:var(--surface);stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round}
.it .th{flex:none;line-height:0}
.kpick{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px;margin:2px 0 14px}
.kopts{display:grid;gap:8px;align-content:start}
.kopt{text-align:left;border:2px solid var(--ink);border-radius:14px;padding:11px 12px;background:var(--surface);color:var(--ink);display:grid;gap:2px}
.kopt .kn{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:800;font-size:16px;line-height:1.15}
.kopt .kq{font-size:12px;opacity:.78}
.kopt.on{background:var(--ink);color:var(--bg);box-shadow:inset 6px 0 0 var(--accent);padding-left:18px}
.kopt.on .kq{opacity:.95}
.kmap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.kmap svg{display:block;width:100%;height:auto}
.kmap .ka{padding:8px 10px 10px;font-size:12px;line-height:1.35;display:grid;gap:4px}
.kmap .ka b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kmap a{color:var(--accent);font-weight:700;text-decoration:none}
.kmap a:hover{text-decoration:underline}
.up{position:relative;display:block;line-height:0;cursor:pointer;border-radius:12px}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.up span{position:absolute;right:2px;bottom:2px;font-size:10px;line-height:1;background:var(--ink);color:var(--bg);padding:2px 4px;border-radius:6px;pointer-events:none}
.lb{border:0;background:none;color:var(--accent);padding:0;font-size:inherit;text-decoration:underline}
@media (max-width:400px){.brand{font-size:14px}}
.done .big{color:var(--ok)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#banner{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;padding:0 max(12px,env(safe-area-inset-left,0px))}
#banner button{display:block;width:100%;max-width:520px;margin:0 auto;text-align:left;border:0;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#banner small{color:inherit;opacity:.7;display:block;font-size:12px;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header class="top">
  <div class="brand">Your <i>Coffee Shop</i></div>
  <div class="seg" id="seg"></div>
</header>
<main id="app"></main>
<div id="cb"></div>
<div id="sheet"></div>
<div id="banner"></div>
<div id="toast" hidden></div>

<script>
/* ============ KONSTANTA & UTIL ============ */

 const hw={8:.3,9:.6,10:1,11:1.1,12:1.2,13:.8,14:.7,15:1.1,16:1.3,17:1.2,18:1,19:1.5,20:1.6,21:1.2,22:.5},HS=Object.values(hw).reduce((a,b)=>a+b,0);
 const hour=()=>{let x=r()*HS;for(const h in hw){x-=hw[h];if(x<=0)return +h}return 20};
 const base={k1:30,k2:17};
 for(let off=75;off>=0;off--){
  const day=t0-off*DAY,dow=new Date(day).getDay(),f=(dow===0||dow===5||dow===6)?1.45:1,tr=1+(75-off)/75*.25;
  for(const k of ['k1','k2']){
   const ks=USERS.filter(u=>u.role==='kasir'&&u.kedai.includes(k)),n=Math.round(base[k]*f*tr*(.85+r()*.3));
   for(let i=0;i<n;i++){
    const t=day+hour()*36e5+Math.floor(r()*60)*6e4;if(t>now-20*6e4)continue;
    const ch=r()<(k==='k1'?.28:.2)?'online':'kasir',cnt=r()<.65?1:r()<.7?2:3,lines=[];
    for(let j=0;j<cnt;j++){const it=pick(),sel=it.g.map(g=>g.c.length>1?(r()<.7?0:Math.floor(r()*g.c.length)):0),q=r()<.1?2:1;
     lines.push({mid:it.id,name:it.n,qty:q,sel:selLabel(it,sel),price:unit(it,sel)})}
    const total=lines.reduce((a,l)=>a+l.qty*l.price,0),u=ks[Math.floor(r()*ks.length)];
    const method=ch==='online'?'QRIS':(x=>x<.5?'Tunai':x<.9?'QRIS':'Transfer')(r());
    kasSale({id:0,t,kedai:k,ch,method,total,kasir:u&&u.id,no:i+1,lines});
   }
   const D=new Date(day);
   if(dow===1)KAS.push({id:++KID,t:day+10*36e5,kedai:k,type:'KELUAR',ch:'manual',method:'Tunai',amt:-Math.round((k==='k1'?2.2e6:1.2e6)*(.8+r()*.4)/1e4)*1e4,who:'Pemilik',cat:'Bahan baku',note:'Belanja mingguan'});
   if(D.getDate()===1)KAS.push({id:++KID,t:day+9*36e5,kedai:k,type:'KELUAR',ch:'manual',method:'Transfer',amt:-(k==='k1'?3.5e6:2.5e6),who:'Pemilik',cat:'Sewa',note:'Sewa bulanan'});
   if(D.getDate()===25)KAS.push({id:++KID,t:day+16*36e5,kedai:k,type:'KELUAR',ch:'manual',method:'Transfer',amt:-(k==='k1'?4.5e6:2.5e6),who:'Pemilik',cat:'Gaji',note:'Gaji kasir & barista'});
   if(D.getDate()===5)KAS.push({id:++KID,t:day+11*36e5,kedai:k,type:'KELUAR',ch:'manual',method:'Transfer',amt:-(k==='k1'?850e3:520e3),who:'Pemilik',cat:'Listrik & air',note:''});
  }
 }
}

const act=k=>S.orders.filter(o=>o.kedai===k&&(o.st==='baru'||o.st==='proses'));
const cups=o=>o.lines.reduce((a,l)=>a+l.qty,0);
const cost=n=>S.set.per+S.set.extra*Math.max(0,n-1);
const remain=o=>cost(cups(o))*(o.st==='proses'?.5:1);
const rm=k=>S.ramai[k]?10:0;
function etaOrder(o){if(o.st==='siap'||o.st==='selesai'||o.st==='batal')return 0;let m=0;for(const x of S.orders){if(x.id===o.id)break;if(x.kedai===o.kedai&&(x.st==='baru'||x.st==='proses'))m+=remain(x)}return Math.max(1,Math.round(m+remain(o)+rm(o.kedai)))}
const etaNew=(k,n)=>Math.max(1,Math.round(act(k).reduce((a,o)=>a+remain(o),0)+cost(n)+rm(k)));
const CT=c=>S.cart[c];
const cartCups=c=>CT(c).reduce((a,l)=>a+l.qty,0);
const cartTotal=c=>CT(c).reduce((a,l)=>a+l.qty*unit(l.item,l.sel),0);
const inCart=(c,id)=>CT(c).filter(l=>l.item.id===id).reduce((a,l)=>a+l.qty,0);
const ctxK=c=>c==='b'?S.bk:curK();

 const q=Math.min(qty,room);if(q<qty)toast('Stok tersisa '+left(item.id,k));
 const key=item.id+'|'+sel.join(','),ex=CT(c).find(l=>l.key===key);
 if(ex)ex.qty+=q;else CT(c).push({key,item,sel:[...sel],qty:q});
 if(c==='p')S.pk=k;return true;
}

function qrSVG(seed){
 let s=seed*7919+13;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
 const N=25;let d='';
 const fin=(x,y)=>x<8&&y<8||x>N-9&&y<8||x<8&&y>N-9;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!fin(x,y)&&r()>.52)d+=`M${x} ${y}h1v1h-1z`;
 const F=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
 return `<svg viewBox="-1 -1 ${N+2} ${N+2}" role="img" aria-label="QRIS contoh"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/><path d="${d}" fill="#111"/>${F(0,0)}${F(N-7,0)}${F(0,N-7)}</svg>`;
}

/* ============ KEUANGAN ============ */
function rangeOf(){
 const now=Date.now(),t0=dayStart(now),end=t0+DAY,r=S.fin.range;let start;
 if(r==='1')start=t0;else if(r==='7')start=t0-6*DAY;else if(r==='30')start=t0-29*DAY;
 else if(r==='mtd'){const d=new Date(now);d.setDate(1);d.setHours(0,0,0,0);start=d.getTime()}
 else start=dayStart(Math.min(...KAS.map(e=>e.t)));
 const prev=r!=='all'?{ps:start-(end-start),pe:start}:null;
 return {start,end,prev};
}
const selK=(a,b,ks,ch)=>KAS.filter(e=>e.t>=a&&e.t<b&&ks.includes(e.kedai)&&(ch==='all'||e.ch===ch));
function agg(es){
 const a={sales:0,n:0,refunds:0,other:0,exp:0};
 for(const e of es){
  if(e.type==='JUAL'){a.sales+=e.amt;if(!e.void)a.n++}
  else if(e.type==='REFUND'){a.sales+=e.amt;a.refunds-=e.amt}
  else if(e.type==='MASUK')a.other+=e.amt;
  else if(e.type==='KELUAR')a.exp-=e.amt;
 }
 a.net=a.sales+a.other-a.exp;return a;
}
function dl(cur,prev,lowerBetter){
 if(prev==null||prev===0)return '<span class="dl">tanpa pembanding</span>';
 const p=(cur-prev)/Math.abs(prev)*100,up=p>=0,good=lowerBetter?!up:up;
 return `<span class="dl ${good?'good':'bad'}">${up?'▲':'▼'} ${Math.abs(p).toFixed(0)}% vs periode lalu</span>`;
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function buckets(es,start,end){
 const days=Math.max(1,Math.round((end-start)/DAY));let b,idx;
 if(days===1){b=Array.from({length:16},(_,i)=>({l:String(i+7),on:0,ka:0}));idx=e=>Math.min(15,Math.max(0,new Date(e.t).getHours()-7))}
 else{const sz=days>31?7:1,n=Math.ceil(days/sz);b=Array.from({length:n},(_,i)=>({l:fmtD(start+i*sz*DAY),on:0,ka:0}));idx=e=>Math.min(n-1,Math.floor((e.t-start)/DAY/sz))}
 for(const e of es){if(e.type!=='JUAL'&&e.type!=='REFUND')continue;const x=b[idx(e)];if(e.ch==='online')x.on+=e.amt;else x.ka+=e.amt}
 return {b,days,weekly:days>31,hourly:days===1};
}
function chartSVG(bk){
 const W=Math.max(300,Math.min(1088,document.documentElement.clientWidth-32)),H=230,ml=46,mr=6,mt=10,mb=26,iw=W-ml-mr,ih=H-mt-mb;
 const mx=Math.max(1,...bk.map(b=>Math.max(0,b.on)+Math.max(0,b.ka))),step=niceStep(mx/4),top=step*4;
 let g='';
 for(let i=0;i<=4;i++){const y=mt+ih-ih*i/4;g+=`<line class="gl2" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="tx" x="${ml-6}" y="${y+4}" text-anchor="end">${fmtK(step*i)}</text>`}
 const bw=iw/bk.length,w=Math.max(2,bw*.68),every=Math.ceil(bk.length/(W<500?6:12));
 bk.forEach((b,i)=>{
  const x=ml+i*bw+(bw-w)/2,hk=Math.max(0,b.ka)/top*ih,ho=Math.max(0,b.on)/top*ih,yk=mt+ih-hk;
  g+=`<g><title>${b.l} · Kasir ${rp(b.ka)} · Online ${rp(b.on)}</title><rect class="s-ka" x="${x.toFixed(1)}" y="${yk.toFixed(1)}" width="${w.toFixed(1)}" height="${hk.toFixed(1)}"/><rect class="s-on" x="${x.toFixed(1)}" y="${(yk-ho).toFixed(1)}" width="${w.toFixed(1)}" height="${ho.toFixed(1)}"/></g>`;
  if(i%every===0)g+=`<text class="tx" x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${b.l}</text>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik penjualan: kasir dan online">${g}</svg>`;
}
function finHTML(){
 const R=rangeOf(),ks=scope(),ch=S.fin.ch,es=selK(R.start,R.end,ks,ch),A=agg(es);
 const P=R.prev?agg(selK(R.prev.ps,R.prev.pe,ks,ch)):null;
 const now=Date.now(),t0=dayStart(now),T=agg(selK(t0,t0+DAY,ks,ch)),Y=agg(selK(t0-DAY,now-DAY,ks,ch));
 const rl=[['1','Hari ini'],['7','7 hari'],['30','30 hari'],['mtd','Bulan ini'],['all','Semua']],cl=[['all','Semua'],['kasir','Kasir'],['online','Online']];
 const bar=`<div class="fbar"><div class="grpc">${rl.map(([v,l])=>`<button class="chip ${S.fin.range===v?'on':''}" data-a="frange" data-v="${v}">${l}</button>`).join('')}</div><div class="grpc">${cl.map(([v,l])=>`<button class="chip ${S.fin.ch===v?'on':''}" data-a="fch" data-v="${v}">${l}</button>`).join('')}</div></div>`;
 const ex=ch==='all';
 const kpis=`<div class="kpis">
  <div class="kpi"><div class="l">Penjualan bersih</div><div class="v">${rp(A.sales)}</div>${dl(A.sales,P&&P.sales)}</div>
  <div class="kpi"><div class="l">Pesanan</div><div class="v">${A.n.toLocaleString('id-ID')}</div>${dl(A.n,P&&P.n)}</div>
  <div class="kpi"><div class="l">Rata-rata per pesanan</div><div class="v">${A.n?rp(A.sales/A.n):'-'}</div><span class="dl">${A.refunds?'refund '+rp(A.refunds):'tanpa refund'}</span></div>
  ${ex?`<div class="kpi"><div class="l">Pengeluaran</div><div class="v">${rp(A.exp)}</div>${dl(A.exp,P&&P.exp,true)}</div>
  <div class="kpi"><div class="l">Selisih kas</div><div class="v ${A.net<0?'neg':''}">${rp(A.net)}</div><span class="dl">penjualan − pengeluaran</span></div>`:''}
  <div class="kpi"><div class="l">Hari ini</div><div class="v">${rp(T.sales)}</div><span class="dl ${T.sales>=Y.sales?'good':'bad'}">${T.sales>=Y.sales?'▲':'▼'} kemarin jam ini ${rp(Y.sales)}</span></div></div>`;
 if(!A.n&&!A.exp)return bar+kpis+'<div class="empty">Belum ada data di rentang ini.</div>';
 const B=buckets(es,R.start,R.end),ton=B.b.reduce((a,x)=>a+x.on,0),tka=B.b.reduce((a,x)=>a+x.ka,0);
 const unitL=B.hourly?'per jam':B.weekly?'per minggu':'per hari';
 const chart=`<div class="fsec"><h3>Penjualan ${unitL}</h3><div class="leg"><span><i style="background:var(--c-ka)"></i>Kasir ${rp(tka)}</span><span><i style="background:var(--c-on)"></i>Online ${rp(ton)} (${tka+ton?Math.round(ton/(tka+ton)*100):0}%)</span></div>
  <div class="chart">${chartSVG(B.b)}</div>
  <details class="tb"><summary>Lihat tabel</summary><div class="tw"><table><tr><th>${B.hourly?'Jam':B.weekly?'Minggu mulai':'Tanggal'}</th><th>Kasir</th><th>Online</th><th>Total</th></tr>${B.b.map(b=>`<tr><td>${b.l}</td><td>${rp(b.ka)}</td><td>${rp(b.on)}</td><td>${rp(b.ka+b.on)}</td></tr>`).join('')}</table></div></details></div>`;
 /* menu terlaris */
 const mp={};es.forEach(e=>{if(e.type==='JUAL'&&!e.void)e.lines.forEach(l=>{const m=mp[l.name]||(mp[l.name]={q:0,r:0});m.q+=l.qty;m.r+=l.qty*l.price})});
 const top=Object.entries(mp).sort((a,b)=>b[1].q-a[1].q).slice(0,8),mq=top.length?top[0][1].q:1;
 const best=`<div class="fsec"><h3>Menu terlaris</h3><div class="note" style="margin-bottom:6px">Jumlah gelas terjual</div>${top.map(([n,v])=>`<div class="hb"><span class="t" title="${esc(n)}">${esc(n)}</span><span class="tr"><i style="width:${v.q/mq*100}%"></i></span><b>${v.q}</b></div>`).join('')||'<div class="empty">Belum ada penjualan.</div>'}</div>`;
 /* jam tersibuk */
 const H=Array.from({length:7},()=>Array(15).fill(0));let hm=0,pk=null;
 es.forEach(e=>{if(e.type==='JUAL'&&!e.void){const d=new Date(e.t),dw=(d.getDay()+6)%7,h=d.getHours();if(h<8||h>22)return;const v=++H[dw][h-8];if(v>hm){hm=v;pk=[dw,h]}}});
 const DN=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],DF=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
 let hc='<span></span>'+Array.from({length:15},(_,i)=>`<span class="hl">${i%2===0?i+8:''}</span>`).join('');
 H.forEach((row,d)=>{hc+=`<span class="dl2">${DN[d]}</span>`+row.map((v,i)=>`<span class="c" style="background:color-mix(in srgb,var(--c-ka) ${hm?Math.round(8+v/hm*82):8}%,var(--soft))" title="${DF[d]} ${i+8}:00 · ${v} pesanan"></span>`).join('')});
 const heat=`<div class="fsec"><h3>Jam tersibuk</h3><div class="note">${pk?`Puncak: ${DF[pk[0]]} jam ${pk[1]}:00 (${hm} pesanan di rentang ini)`:'Belum ada data'}. Warna makin pekat berarti makin ramai.</div><div class="heat" role="img" aria-label="Peta panas jam tersibuk">${hc}</div></div>`;
 /* metode bayar */
 const pm={};es.forEach(e=>{if(e.type==='JUAL')pm[e.method]=(pm[e.method]||0)+e.amt});
 const pt=Object.values(pm).reduce((a,b)=>a+b,0)||1;
 const pay=`<div class="fsec"><h3>Cara bayar</h3>${Object.entries(pm).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="hb"><span class="t">${m}</span><span class="tr"><i style="width:${v/pt*100}%"></i></span><b>${Math.round(v/pt*100)}%</b></div>`).join('')}<div class="note" style="margin-top:6px">Tunai ${rp(pm.Tunai||0)} perlu dicocokkan dengan uang di laci.</div></div>`;
 /* kasir & kedai */
 const wk={};es.forEach(e=>{if(e.type==='JUAL'&&!e.void){const w=wk[e.who]||(wk[e.who]={n:0,r:0});w.n++;w.r+=e.amt}});
 const kk={};es.forEach(e=>{if(e.type==='JUAL'&&!e.void){const w=kk[e.kedai]||(kk[e.kedai]={n:0,r:0});w.n++;w.r+=e.amt}});
 const who=`<div class="fsec"><h3>Per kasir${ks.length>1?' dan kedai':''}</h3><div class="tw"><table><tr><th>Nama</th><th>Pesanan</th><th>Penjualan</th></tr>${Object.entries(wk).sort((a,b)=>b[1].r-a[1].r).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.n}</td><td>${rp(v.r)}</td></tr>`).join('')}${ks.length>1?Object.entries(kk).map(([k,v])=>`<tr><td><b>${esc(kn(k))}</b></td><td><b>${v.n}</b></td><td><b>${rp(v.r)}</b></td></tr>`).join(''):''}</table></div></div>`;
 /* catat manual */
 const dt=new Date(),ds=dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());
 const manual=`<div class="fsec"><h3>Catat pengeluaran atau pemasukan lain</h3><div class="note">Belanja bahan, gaji, sewa, listrik, atau uang masuk di luar penjualan. Masuk ke buku kas dan ikut hitungan selisih kas.</div>
  <div class="mf"><label>Jenis<select id="mf-t" class="fld"><option value="KELUAR">Pengeluaran</option><option value="MASUK">Pemasukan lain</option></select></label>
  <label>Kategori<select id="mf-c" class="fld">${['Bahan baku','Gaji','Sewa','Listrik & air','Perawatan','Lainnya'].map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label>Kedai<select id="mf-k" class="fld">${KEDAI.map(k=>`<option value="${k.id}" ${S.fin.mk===k.id?'selected':''}>${esc(k.n)}</option>`).join('')}</select></label>
  <label>Tanggal<input id="mf-d" class="fld" type="date" value="${ds}"></label>
  <label>Jumlah (Rp)<input id="mf-a" class="fld" type="number" inputmode="numeric" placeholder="0"></label>
  <label>Metode<select id="mf-m" class="fld"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select></label>
  <label>Catatan<input id="mf-n" class="fld" placeholder="Opsional"></label><button class="btn sm" data-a="mfadd">Catat</button></div></div>`;
 /* buku kas */
 const lst=[...es].sort((a,b)=>b.t-a.t),TL={JUAL:'Penjualan',REFUND:'Refund',MASUK:'Pemasukan lain',KELUAR:'Pengeluaran'};
 const desc=e=>e.type==='JUAL'||e.type==='REFUND'?`#${pad(e.no)} · ${e.ch==='online'?'Online':esc(e.who)}${e.void?' (dibatalkan)':''}`:`${esc(e.cat||'')}${e.note?' · '+esc(e.note):''}`;
 const book=`<div class="fsec"><h3>Buku kas</h3><div class="note">${Math.min(30,lst.length)} catatan terbaru dari ${lst.length.toLocaleString('id-ID')} di rentang ini. Catatan tidak dihapus: pembatalan dicatat sebagai refund.</div>
  <div class="tw"><table><tr><th>Waktu</th><th>Jenis</th><th>Keterangan</th><th>Kedai</th><th>Metode</th><th>Jumlah</th></tr>${lst.slice(0,30).map(e=>`<tr><td>${fmtDT(e.t)}</td><td>${TL[e.type]}</td><td style="text-align:left">${desc(e)}</td><td>${esc(kn(e.kedai))}</td><td>${e.method}</td><td class="${e.amt<0?'neg':'pos'}">${e.amt<0?'−':'+'}${rp(Math.abs(e.amt))}</td></tr>`).join('')}</table></div></div>`;
 return bar+kpis+chart+`<div class="fgrid">${best}${heat}${pay}${who}</div>`+(ex||true?manual+book:'');
}

/* ============ RENDER ============ */
function render(){
 $('#seg').innerHTML=`<button class="${S.mode==='buyer'?'on':''}" data-a="mode" data-v="buyer">Pembeli${S.banner&&S.mode!=='buyer'?'<span class="badge">1</span>':''}</button><button class="${S.mode==='staff'?'on':''}" data-a="mode" data-v="staff">Staf${S.newCount&&S.mode!=='staff'?`<span class="badge">${S.newCount}</span>`:''}</button>`;
 const app=$('#app');
 if(S.mode==='buyer'){
  if(S.screen==='pay'&&S.pay)app.innerHTML=payHTML();
  else if(S.screen==='status'&&S.my.length)app.innerHTML=statusHTML();
  else{S.screen='menu';app.innerHTML=buyerMenu();updateChips('b');updateList('b')}
 }else{
  app.innerHTML=staffHTML();
  if(S.user){
   if(S.tab==='pos'){updateChips('p');updateList('p')}
   else if(S.tab==='stok')updateStock();
   else if(S.tab==='menu')updateMenuAdm();
  }
 }
 renderCartbar();renderSheet();renderBanner();
}
let bT;
function renderBanner(){
 const el=$('#banner');
 if(S.banner&&S.mode==='buyer'){
  el.innerHTML=`<button data-a="openstatus"><small>Your Coffee Shop · sekarang</small><b>${S.banner}</b></button>`;
  clearTimeout(bT);bT=setTimeout(()=>{S.banner=null;render()},9000);
 }else el.innerHTML='';
}

  case 'rmphoto':{if(!isAdmin())break;const m=MENU.find(q=>q.id==v);delete m.img;Object.keys(DRC).forEach(k=>{if(k.startsWith(v+':'))delete DRC[k]});updateMenuAdm();toast('Foto dihapus, kembali ke ilustrasi');break}
  case 'closeforce':S.sheet=null;render();break;
  case 'mode':S.mode=v;if(v==='staff')S.newCount=0;S.sheet=null;render();break;
  case 'cat':S.vw[c].cat=v;updateChips(c);updateList(c);break;
  case 'add':{const it=MENU.find(m=>m.id==v),k=ctxK(c);
   if(left(it.id,k)-inCart(c,it.id)<=0){toast('Stok '+it.n+' tidak cukup');break}
   if(it.g.length){S.sheet={t:'item',c,item:it,sel:it.g.map(()=>0),qty:1};renderSheet()}
   else if(addLine(c,it,[],1)){toast('+1 '+it.n);updateList(c);renderCartbar()}
   break}
  case 'opt':S.sheet.sel[el.dataset.g]=+v;renderSheet();break;
  case 'q+':{const sh=S.sheet,room=left(sh.item.id,ctxK(sh.c))-inCart(sh.c,sh.item.id);if(sh.qty<room)sh.qty++;else toast('Stok tidak cukup');renderSheet();break}
  case 'q-':S.sheet.qty=Math.max(1,S.sheet.qty-1);renderSheet();break;
  case 'addcart':{const sh=S.sheet;if(addLine(sh.c,sh.item,sh.sel,sh.qty))toast(sh.item.n+' masuk');S.sheet=null;updateList(sh.c);renderCartbar();renderSheet();break}
  case 'opencart':S.sheet={t:'cart',c};S.F[c].err='';renderSheet();break;
  case 'cl+':{const l=CT(c)[v],room=left(l.item.id,ctxK(c))-inCart(c,l.item.id);if(room>0)l.qty++;else toast('Stok tidak cukup');renderSheet();break}
  case 'cl-':CT(c)[v].qty--;if(CT(c)[v].qty<=0)CT(c).splice(v,1);if(!CT(c).length)S.sheet=null;updateList(c);renderCartbar();renderSheet();break;
  case 'cmode':S.F[c].mode=v;renderSheet();break;
  case 'pmethod':S.F.p.method=v;S.F.p.err='';renderSheet();break;
  case 'recvq':S.F.p.recv=String(v);renderSheet();break;
  case 'topay':{const n=($('#cname').value||'').trim();S.F.b.name=n;
   if(!n){S.F.b.err='Isi nama supaya barista bisa memanggilmu.';return renderSheet()}
   const k=S.bk;for(const l of CT('b'))if(left(l.item.id,k)<inCart('b',l.item.id)){S.F.b.err=l.item.n+' baru saja habis. Kurangi jumlahnya.';return renderSheet()}
   S.F.b.err='';S.pay={name:n,mode:S.F.b.mode,kedai:k,total:cartTotal('b'),created:Date.now(),seed:S.uid,
    lines:CT('b').map(l=>({mid:l.item.id,name:l.item.n,qty:l.qty,sel:selLabel(l.item,l.sel),price:unit(l.item,l.sel)}))};
   S.sheet=null;S.screen='pay';render();window.scrollTo(0,0);break}
  case 'cancelpay':S.screen='menu';S.pay=null;S.sheet={t:'cart',c:'b'};render();break;
  case 'paid':{const p=S.pay;
   for(const l of p.lines)if(left(l.mid,p.kedai)<l.qty){toast(l.name+' baru saja habis, pesanan tidak diproses');S.pay=null;S.screen='menu';S.cart.b=[];render();return}
   const o=placeOrder({kedai:p.kedai,ch:'online',method:'QRIS',kasir:null,name:p.name,mode:p.mode,lines:p.lines,total:p.total});
   S.my.push(o.id);S.cart.b=[];S.pay=null;S.screen='status';S.newCount++;beep();render();window.scrollTo(0,0);toast('Pembayaran diterima, pesanan masuk ke bar');break}
  case 'psave':{const F=S.F.p,tot=cartTotal('p'),k=curK();
   for(const l of CT('p'))if(left(l.item.id,k)<inCart('p',l.item.id)){F.err=l.item.n+' stoknya tidak cukup.';return renderSheet()}
   let change=0;
   if(F.method==='Tunai'){if(F.recv===''||+F.recv<tot){F.err='Uang diterima kurang dari total.';return renderSheet()}change=+F.recv-tot}
   F.err='';
   const o=placeOrder({kedai:k,ch:'kasir',method:F.method,kasir:S.user.id,name:F.name.trim()||'Tanpa nama',mode:F.mode,total:tot,
    lines:CT('p').map(l=>({mid:l.item.id,name:l.item.n,qty:l.qty,sel:selLabel(l.item,l.sel),price:unit(l.item,l.sel)}))});
   S.cart.p=[];F.name='';F.recv='';F.method='Tunai';S.sheet={t:'done',o,change};render();break}
  case 'again':S.screen='menu';render();break;
  case 'openstatus':S.banner=null;S.screen='status';render();break;
  case 'login':{const u=USERS.find(x=>x.id===($('#lu').value));
   if(!u||u.pin!==$('#lp').value){S.lerr='PIN salah. Coba lagi.';S.lu=$('#lu').value;return render()}
   S.user=u;S.lerr='';S.tab=u.role==='admin'?'orders':'pos';S.vk=u.role==='admin'?'all':u.kedai[0];S.cart.p=[];render();break}

   list.forEach(m=>ks.forEach(k=>{STOCK[sk(m.id,k)]=v==='set'?Math.max(0,Math.floor(+val)):v==='zero'?0:null}));
   updateStock();toast(`${list.length} menu diperbarui`);break}
  case 'toggleadd':S.showAdd=!S.showAdd;render();break;
  case 'addmenu':{if(!isAdmin())break;const n=$('#nn').value.trim(),p=+$('#np').value;if(!n||!p)return toast('Isi nama dan harga');
   MENU.push({id:++_id,cat:$('#nc').value,n,p,g:$('#nt').checked?[TEMP]:[]});S.showAdd=false;toast(n+' ditambahkan');render();break}
  case 'ramai':S.ramai[v]=!S.ramai[v];render();break;
  case 'sound':S.set.sound=!S.set.sound;render();break;
  case 'uon':{const u=USERS.find(x=>x.id===v);u.on=!u.on;render();break}

   if(USERS.some(u=>u.pin===p))return toast('PIN itu sudah dipakai, pilih yang lain');
   USERS.push({id:'u'+(USERS.length+10),n,role:'kasir',pin:p,kedai:ks,on:true});render();toast('Kasir '+n+' ditambahkan');break}
  case 'addkedai':{const n=$('#nk-n').value.trim();if(!n)return toast('Isi nama kedai');
   const id='k'+(KEDAI.length+10);KEDAI.push({id,n});S.cnt[id]=1;S.ramai[id]=false;render();toast(n+' ditambahkan, stok awal tak terbatas');break}

   const same=dayStart(when)===dayStart(Date.now());S.fin.mk=$('#mf-k').value;
   KAS.push({id:++KID,t:same?Date.now():when,kedai:$('#mf-k').value,type:t,ch:'manual',method:$('#mf-m').value,amt:t==='KELUAR'?-amt:amt,who:S.user.n,cat:t==='KELUAR'?$('#mf-c').value:'Pemasukan lain',note:$('#mf-n').value.trim()});

});

 else if(id.startsWith('sort-')){const c=id.slice(5);S.vw[c].sort=t.value;updateList(c)}
 else if(id==='cname'){const c=S.sheet&&S.sheet.c;if(c)S.F[c].name=t.value}
 else if(id==='recv'){S.F.p.recv=t.value;const ch=t.value===''?null:+t.value-cartTotal('p');$('#chg').textContent=ch===null?'-':ch>=0?rp(ch):'Kurang '+rp(-ch)}
 else if(id==='sq'){S.st.q=t.value;updateStock()}
 else if(id==='mq'){S.mq=t.value;updateMenuAdm()}
 else if(id==='per'){S.set.per=+t.value;$('#perv').textContent=t.value+' mnt'}
 else if(id==='extra'){S.set.extra=+t.value;$('#extrav').textContent='+'+t.value+' mnt'}

 else if(id==='sf'){S.st.f=t.value;updateStock()}

 else if(a==='price'){if(!isAdmin())return;const m=MENU.find(m=>m.id==t.dataset.v);m.p=Math.max(0,+t.value||0);toast(`Harga ${m.n}: ${rp(m.p)}`)}

 else if(a==='ukedai'){const u=USERS.find(x=>x.id===t.dataset.v),k=t.dataset.k;

  toast('Penugasan '+u.n+' diperbarui')}
 else if(a==='kname'){const k=KEDAI.find(x=>x.id===t.dataset.v);if(t.value.trim())k.n=t.value.trim();else t.value=k.n}
 else if(a==='kaddr'){KEDAI.find(x=>x.id===t.dataset.v).addr=t.value.trim();toast('Alamat disimpan')}
 else if(a==='kmaps'){const k=KEDAI.find(x=>x.id===t.dataset.v),v=t.value.trim();if(v&&!/^https?:\/\//.test(v)){t.value=k.maps||'';return toast('Link harus diawali https://')}k.maps=v;toast('Link Maps disimpan')}
 else if(id==='mf-k')S.fin.mk=t.value;
});
